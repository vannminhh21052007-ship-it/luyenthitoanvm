<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Luyện Đề - M</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --ink:#16213A; --paper:#FBF8F2; --paper-2:#F3EEE1; --rule:#E2DAC6;
            --wine:#7A2E38; --wine-soft:#F3E7E5;
            --steel:#1F4E5F; --steel-soft:#E7EEEC;
            --moss:#3F5B3A; --moss-soft:#E8EEE2;
            --gold:#AD8A48; --muted:#5B6472;
        }
        body{ font-family:'Be Vietnam Pro', sans-serif; color:var(--ink); }
        .font-display{ font-family:'Lora', serif; }

        .bg-scene{
            background-image:
                linear-gradient(rgba(16,24,42,0.82), rgba(16,24,42,0.93)),
                url('https://i.ibb.co/CpBrfkk9/Screenshot-2026-09-16-225502.png');
        }

        .seal{
            width:5.5rem; height:5.5rem; border-radius:9999px; background:var(--paper);
            border:1px solid var(--gold);
            box-shadow:0 0 0 4px var(--paper), 0 0 0 5px rgba(173,138,72,0.55);
            display:flex; align-items:center; justify-content:center;
        }
        .seal span{ font-family:'Lora', serif; font-weight:700; font-size:2.1rem; color:var(--ink); }

        .paper-card{
            background:var(--paper); border:1px solid var(--rule); border-radius:6px;
            box-shadow:0 24px 48px -20px rgba(10,15,30,0.55);
        }
        .exam-input{
            width:100%; background:transparent; border:none; border-bottom:1.5px solid var(--rule);
            padding:0.85rem 0.25rem; text-align:center; font-weight:600; letter-spacing:0.35em;
            font-size:1.05rem; color:var(--ink); transition:border-color .2s ease;
        }
        .exam-input:focus{ outline:none; border-bottom-color:var(--gold); }
        .exam-input::placeholder{ letter-spacing:0.05em; color:#9CA3AF; font-weight:500; }
        .btn-primary{
            background:var(--ink); color:var(--paper); font-weight:600; letter-spacing:0.02em;
            border-radius:4px; padding:0.85rem 1.5rem; transition:background .2s ease;
        }
        .btn-primary:hover{ background:#0B1428; }

        /* Tiêu đề trang */
        .rule-gold{ display:flex; align-items:center; gap:.9rem; width:min(20rem,70%); margin:1.25rem auto 0; }
        .rule-gold::before,.rule-gold::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(216,196,140,.7)); }
        .rule-gold::after{ transform:scaleX(-1); }
        .rule-gold i{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); }

        /* Bảng đề */
        .panel{
            background:var(--paper); border:1px solid var(--rule); border-radius:6px;
            display:flex; flex-direction:column; overflow:hidden;
            box-shadow:0 24px 48px -24px rgba(10,15,30,0.6);
            border-top:4px solid var(--accent);
        }
        .panel-head{ padding:1.6rem 1.75rem 1.25rem; border-bottom:1px solid var(--rule); background:var(--paper-2); }
        .panel-code{ font-family:'Lora',serif; font-weight:700; font-size:2rem; line-height:1; color:var(--accent); }
        .panel-name{ font-weight:600; margin-top:.5rem; }
        .panel-desc{ font-size:.8rem; color:var(--muted); margin-top:.15rem; }
        .count{
            font-size:.75rem; font-weight:600; color:var(--accent); background:var(--soft);
            border-radius:9999px; padding:.25rem .7rem; white-space:nowrap;
        }
        .row-list{ flex:1; }
        .row{
            display:flex; align-items:center; gap:1rem; padding:1rem 1.75rem;
            border-bottom:1px solid var(--rule); transition:background .18s ease;
        }
        .row:last-child{ border-bottom:none; }
        .row:hover, .row:focus-visible{ background:var(--soft); outline:none; }
        .row:focus-visible{ box-shadow:inset 3px 0 0 var(--accent); }
        .badge{
            font-family:'Lora',serif; font-style:italic; font-weight:600; font-size:1.05rem;
            width:2.25rem; height:2.25rem; border-radius:9999px; flex-shrink:0;
            display:flex; align-items:center; justify-content:center;
            background:var(--soft); color:var(--accent);
        }
        .row-title{ font-weight:600; }
        .row-go{
            margin-left:auto; font-size:.8rem; font-weight:600; color:var(--accent);
            opacity:0; transition:opacity .18s ease;
        }
        .row:hover .row-go, .row:focus-visible .row-go{ opacity:1; }
        @media (hover:none){ .row-go{ opacity:.8; } }
        .empty{ padding:2rem 1.75rem; color:var(--muted); font-size:.9rem; text-align:center; }

        .tsa{ --accent:var(--wine);  --soft:var(--wine-soft); }
        .hsa{ --accent:var(--steel); --soft:var(--steel-soft); }
        .thpt{ --accent:var(--moss); --soft:var(--moss-soft); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12 selection:bg-amber-100 bg-cover bg-center bg-fixed bg-no-repeat bg-scene">

    <!-- ================= MÀN HÌNH KHÓA ================= -->
    <div id="lock-screen-wrapper" class="flex items-center justify-center min-h-[80vh]">
        <div class="max-w-md w-full paper-card p-8 md:p-10 text-center">
            <div class="seal mx-auto mb-6"><span>M</span></div>
            <h1 class="font-display text-2xl text-[var(--ink)] mb-2">Khu vực bảo mật</h1>
            <p class="text-[var(--muted)] mb-8 text-sm">Nhập mật khẩu để vào hệ thống luyện đề.</p>
            <form onsubmit="checkPassword(event)" class="flex flex-col gap-5">
                <input type="password" id="password-box" placeholder="• • • • • • • •" class="exam-input" required>
                <button type="submit" class="btn-primary">Mở khóa</button>
                <p id="error-msg" class="text-[var(--wine)] text-sm font-medium -mt-1 hidden">Mật khẩu không chính xác. Vui lòng thử lại.</p>
            </form>
        </div>
    </div>

    <!-- ================= MÀN HÌNH CHÍNH ================= -->
    <div id="main-content" class="max-w-6xl mx-auto hidden">

        <div class="text-center mb-12 mt-4 flex flex-col items-center">
            <div class="seal mb-6"><span>M</span></div>
            <h1 class="font-display text-4xl md:text-5xl text-white mb-3 tracking-tight">
                Công phá kỳ thi <span class="italic" style="color:#D8C48C;">TSA · HSA · THPT</span>
            </h1>
            <p class="text-slate-300 text-sm">Hệ thống thi thử đánh giá tư duy, đánh giá năng lực và tốt nghiệp THPT</p>
            <div class="rule-gold" aria-hidden="true"><i></i></div>
        </div>

        <!-- 3 cột được tạo tự động từ danh sách ở phần script bên dưới -->
        <div id="exam-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 items-stretch"></div>

        <div class="text-center mt-12 text-slate-400 text-sm">
            <p>© 2026 Hệ thống phát triển bởi M.</p>
        </div>
    </div>

    <script>
        // ===== MẬT KHẨU: THAY ĐỔI Ở DÒNG DƯỚI =====
        const MY_PASSWORD = "21052007";

        // ===== DANH SÁCH ĐỀ =====
        // Thêm đề mới: tăng số "count" lên 1 và upload file tương ứng
        // (ví dụ tsa6.html, hsa5.html, thpt4.html). Không cần sửa chỗ nào khác.
        const EXAMS = [
            { id: "tsa",  cls: "tsa",  code: "TSA",  name: "Tư duy",         desc: "Đánh giá tư duy",              count: 5 },
            { id: "hsa",  cls: "hsa",  code: "HSA",  name: "Năng lực",       desc: "Đánh giá năng lực",            count: 4 },
            { id: "thpt", cls: "thpt", code: "THPT", name: "Tốt nghiệp THPT", desc: "Thi tốt nghiệp trung học phổ thông", count: 3 }
        ];

        function renderExams() {
            const grid = document.getElementById("exam-grid");
            grid.innerHTML = EXAMS.map(e => {
                const rows = Array.from({ length: e.count }, (_, i) => {
                    const n = String(i + 1).padStart(2, "0");
                    return `<a href="${e.id}${i + 1}.html" target="_blank" rel="noopener" class="row">
                                <span class="badge">${n}</span>
                                <span class="row-title">Luyện đề ${e.code} ${n}</span>
                                <span class="row-go">Làm bài</span>
                            </a>`;
                }).join("");
                const body = e.count > 0 ? rows : `<div class="empty">Chưa có đề. Đề mới sẽ được cập nhật sớm.</div>`;
                return `<section class="panel ${e.cls}">
                            <div class="panel-head flex items-start justify-between gap-3">
                                <div>
                                    <div class="panel-code">${e.code}</div>
                                    <div class="panel-name">${e.name}</div>
                                    <div class="panel-desc">${e.desc}</div>
                                </div>
                                <span class="count">${String(e.count).padStart(2, "0")} đề</span>
                            </div>
                            <div class="row-list flex flex-col">${body}</div>
                        </section>`;
            }).join("");
        }
        renderExams();

        function checkPassword(event) {
            event.preventDefault();
            const inputVal = document.getElementById('password-box').value;
            const errorMsg = document.getElementById('error-msg');
            if (inputVal === MY_PASSWORD) {
                document.getElementById('lock-screen-wrapper').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('password-box').value = '';
            }
        }
    </script>
</body>
</html>
